<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>У меня к тебе серьёзный вопрос ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #18081c;
      --bg-mid: #2e1136;
      --card-bg: rgba(58, 25, 68, 0.55);
      --card-border: rgba(255, 190, 220, 0.22);
      --pink-light: #ff9ebb;
      --pink-main: #ff5c8d;
      --pink-glow: rgba(255, 92, 141, 0.55);
      --text-main: #fff5f8;
      --text-muted: #d4b2c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #4b1d52 0%, var(--bg-mid) 45%, var(--bg-dark) 100%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 16px;
    }

    /* Фоновые сердечки и частицы */
    #bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-heart {
      position: absolute;
      color: rgba(255, 130, 175, 0.25);
      animation: floatUp linear infinite;
      font-size: 14px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.5;
      }
      80% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(25deg);
        opacity: 0;
      }
    }

    /* Главная карточка */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 32px 32px 36px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Индикатор шагов сверху */
    .steps-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .step-dot {
      width: 22px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.35s ease;
    }

    .step-dot.active {
      width: 30px;
      background: var(--pink-light);
      box-shadow: 0 0 10px var(--pink-glow);
    }

    /* Экраны */
    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Котик */
    .cat-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 14px;
      animation: gentleBob 3s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Текстовая типографика */
    .eyebrow {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--pink-light);
      margin-bottom: 8px;
      font-weight: 600;
      opacity: 0.9;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      line-height: 1.1;
      font-weight: 700;
      margin-bottom: 14px;
      color: #ffffff;
      text-shadow: 0 2px 15px rgba(255, 120, 170, 0.25);
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 340px;
      margin-bottom: 24px;
    }

    .subtitle i {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: #ffd0e0;
    }

    /* Кнопки первого экрана */
    .buttons-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 54px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 13px 32px;
      border-radius: 999px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, opacity 0.3s ease;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff85a9 0%, #ff477e 100%);
      color: #fff;
      box-shadow: 0 8px 25px var(--pink-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      z-index: 3;
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 32px rgba(255, 71, 126, 0.75);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      z-index: 4;
      white-space: nowrap;
    }

    .hint-caption {
      margin-top: 14px;
      min-height: 20px;
      font-size: 13px;
      font-style: italic;
      color: rgba(255, 190, 215, 0.75);
      transition: opacity 0.3s ease;
    }

    /* Экран 2: Выбор дня и времени */
    .section-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 210, 230, 0.6);
      margin: 8px 0 8px;
    }

    .days-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
      width: 100%;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 10px;
      min-width: 54px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .day-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .day-card.selected {
      background: linear-gradient(135deg, #ff85a9 0%, #ff477e 100%);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 6px 20px var(--pink-glow);
      transform: translateY(-2px);
    }

    .day-name {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.75;
    }

    .day-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .day-month {
      font-size: 10px;
      opacity: 0.75;
    }

    .time-sub-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 210, 230, 0.45);
      margin: 4px 0 6px;
    }

    .time-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }

    .time-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .time-pill:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .time-pill.selected {
      background: linear-gradient(135deg, #ff85a9 0%, #ff477e 100%);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 5px 15px var(--pink-glow);
    }

      font-
