<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>У меня к тебе серьёзный вопрос ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #18081c;
      --bg-mid: #2e1136;
      --card-bg: rgba(58, 25, 68, 0.55);
      --card-border: rgba(255, 190, 220, 0.22);
      --pink-light: #ff9ebb;
      --pink-main: #ff5c8d;
      --pink-glow: rgba(255, 92, 141, 0.55);
      --text-main: #fff5f8;
      --text-muted: #d4b2c8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;	
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #4b1d52 0%, var(--bg-mid) 45%, var(--bg-dark) 100%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 30px 16px;
    }

    /* Фоновые сердечки и частицы */
    #bg-particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .bg-heart {
      position: absolute;
      color: rgba(255, 130, 175, 0.25);
      animation: floatUp linear infinite;
      font-size: 14px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.7) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.5;
      }
      80% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(25deg);
        opacity: 0;
      }
    }

    /* Главная карточка */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      margin: auto;
      background: var(--card-bg);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      padding: 32px 32px 36px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.55),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Индикатор шагов сверху */
    .steps-indicator {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .step-dot {
      width: 22px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.35s ease;
    }

    .step-dot.active {
      width: 30px;
      background: var(--pink-light);
      box-shadow: 0 0 10px var(--pink-glow);
    }

    /* Экраны */
    .screen {
      display: none;
      width: 100%;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease forwards;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Котик */
    .cat-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 14px;
      animation: gentleBob 3s ease-in-out infinite;
    }

    @keyframes gentleBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Текстовая типографика */
    .eyebrow {
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--pink-light);
      margin-bottom: 8px;
      font-weight: 600;
      opacity: 0.9;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      line-height: 1.1;
      font-weight: 700;
      margin-bottom: 14px;
      color: #ffffff;
      text-shadow: 0 2px 15px rgba(255, 120, 170, 0.25);
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 340px;
      margin-bottom: 24px;
    }

    .subtitle i {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: #ffd0e0;
    }

    /* Кнопки первого экрана */
    .buttons-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      min-height: 54px;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 13px 32px;
      border-radius: 999px;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease, opacity 0.3s ease;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff85a9 0%, #ff477e 100%);
      color: #fff;
      box-shadow: 0 8px 25px var(--pink-glow), inset 0 1px 1px rgba(255, 255, 255, 0.4);
      z-index: 3;
    }

    .btn-yes:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 32px rgba(255, 71, 126, 0.75);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(8px);
      z-index: 4;
      white-space: nowrap;
    }

    .hint-caption {
      margin-top: 14px;
      min-height: 20px;
      font-size: 13px;
      font-style: italic;
      color: rgba(255, 190, 215, 0.75);
      transition: opacity 0.3s ease;
    }

    /* Экран 2: Выбор дня и времени */
    .section-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 210, 230, 0.6);
      margin: 8px 0 8px;
    }

    .days-grid {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
      width: 100%;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 10px;
      min-width: 54px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .day-card:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    .day-card.selected {
      background: linear-gradient(135deg, #ff85a9 0%, #ff477e 100%);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 6px 20px var(--pink-glow);
      transform: translateY(-2px);
    }

    .day-name {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      opacity: 0.75;
    }

    .day-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .day-month {
      font-size: 10px;
      opacity: 0.75;
    }

    .time-sub-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255, 210, 230, 0.45);
      margin: 4px 0 6px;
    }

    .time-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }

    .time-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .time-pill:hover {
      background: rgba(255, 255, 255, 0.13);
    }

    .time-pill.selected {
      background: linear-gradient(135deg, #ff85a9 0%, #ff477e 100%);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 5px 15px var(--pink-glow);
    }

    .status-script {
      font-family: 'Caveat', cursive;
      font-size: 22px;
      color: #ffb8d0;
      min-height: 28px;
      margin: 6px 0 10px;
    }

    .btn-submit {
      width: 100%;
      max-width: 280px;
      opacity: 0.4;
      pointer-events: none;
    }

    .btn-submit.ready {
      opacity: 1;
      pointer-events: auto;
    }

    /* Экран 3: Конверт и отправка */
    .envelope-box {
      margin: 30px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }

    .envelope-svg {
      width: 130px;
      height: 100px;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.45));
      animation: pulseEnvelope 1.4s ease-in-out infinite;
    }

    @keyframes pulseEnvelope {
      0%, 100% { transform: scale(1) rotate(-3deg); }
      50% { transform: scale(1.08) rotate(3deg); }
    }

    .note-box {
      position: relative;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 210, 230, 0.25);
      border-radius: 18px;
      padding: 28px 34px;
      margin-top: 15px;
    }

    .note-tape {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%) rotate(-2deg);
      width: 68px;
      height: 20px;
      background: rgba(255, 225, 235, 0.65);
      border-radius: 3px;
    }

    .script-title {
      font-family: 'Caveat', cursive;
      font-size: 30px;
      color: #ffdbe7;
      margin-bottom: 6px;
    }

    /* Экран 4: Финал */
    .final-script {
      font-family: 'Caveat', cursive;
      font-size: 46px;
      color: #ffffff;
      margin-bottom: 14px;
      text-shadow: 0 3px 16px var(--pink-glow);
    }

    .chosen-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 130, 175, 0.16);
      border: 1px solid rgba(255, 160, 195, 0.38);
      padding: 9px 20px;
      border-radius: 999px;
      font-size: 14px;
      color: #ffe8f0;
      margin-bottom: 22px;
    }

    .signature {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 22px;
      color: var(--pink-light);
      margin-top: 8px;
    }

    /* Взрыв сердечек */
    .burst-heart {
      position: fixed;
      pointer-events: none;
      z-index: 99;
      font-size: 18px;
      animation: burstAnim 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes burstAnim {
      0% {
        transform: translate(0, 0) scale(0.4) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot));
        opacity: 0;
      }
    }

    /* Адаптация под экраны телефонов */
    @media (max-width: 480px) {
      body {
        padding: 12px 10px;
      }

      .card {
        padding: 22px 18px 24px;
        border-radius: 26px;
      }

      .steps-indicator {
        margin-bottom: 14px;
      }

      .cat-wrapper {
        width: 110px;
        height: 110px;
        margin-bottom: 10px;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
      }

      h1 {
        font-size: 30px;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 14px;
        margin-bottom: 18px;
      }

      .btn {
        padding: 12px 26px;
        font-size: 14px;
      }

      .days-grid {
        gap: 6px;
        margin-bottom: 10px;
      }

      .day-card {
        min-width: 46px;
        padding: 6px 8px;
        border-radius: 12px;
      }

      .day-num {
        font-size: 19px;
      }

      .time-grid {
        gap: 6px;
      }

      .time-pill {
        padding: 6px 11px;
        font-size: 12px;
      }

      .final-script {
        font-size: 38px;
      }

      .note-box {
        padding: 22px 20px;
      }

      .script-title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>

  <!-- Фоновые сердечки -->
  <div id="bg-particles"></div>

  <div class="card" id="main-card">
    <div class="steps-indicator" id="steps-indicator">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <!-- ЭКРАН 1: Вопрос -->
    <div class="screen active" id="screen-1">
      <div class="cat-wrapper">
        <!-- Милый котик с сердечком -->
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <!-- Маленькие сердечки вокруг -->
          <path d="M38 52 C35 47, 27 47, 27 54 C27 60, 38 66, 38 66 C38 66, 49 60, 49 54 C49 47, 41 47, 38 52 Z" fill="#ff7aa8" opacity="0.8"/>
          <path d="M164 48 C162 44, 155 44, 155 50 C155 55, 164 60, 164 60 C164 60, 173 55, 173 50 C173 44, 166 44, 164 48 Z" fill="#ff7aa8" opacity="0.8"/>
          <!-- Ушки -->
          <polygon points="52,85 42,35 85,62" fill="#ffdfb3" />
          <polygon points="55,78 48,44 78,63" fill="#ff9ebb" />
          <polygon points="148,85 158,35 115,62" fill="#ffdfb3" />
          <polygon points="145,78 152,44 122,63" fill="#ff9ebb" />
          <!-- Тело -->
          <ellipse cx="100" cy="145" rx="44" ry="38" fill="#ffdfb3" />
          <!-- Голова -->
          <circle cx="100" cy="95" r="46" fill="#ffe4be" />
          <!-- Румянец -->
          <ellipse cx="68" cy="104" rx="9" ry="5" fill="#ff8da8" opacity="0.6" />
          <ellipse cx="132" cy="104" rx="9" ry="5" fill="#ff8da8" opacity="0.6" />
          <!-- Глазки -->
          <circle cx="78" cy="92" r="6.5" fill="#2b122e" />
          <circle cx="76" cy="89.5" r="2.2" fill="#ffffff" />
          <circle cx="122" cy="92" r="6.5" fill="#2b122e" />
          <circle cx="120" cy="89.5" r="2.2" fill="#ffffff" />
          <!-- Носик и ротик -->
          <polygon points="97,99 103,99 100,103" fill="#ff6b95" />
          <path d="M93 106 Q100 112 107 106" stroke="#85465d" stroke-width="2.2" fill="none" stroke-linecap="round" />
          <!-- Усики -->
          <line x1="42" y1="96" x2="58" y2="99" stroke="#d4a88c" stroke-width="2" stroke-linecap="round" />
          <line x1="40" y1="104" x2="57" y2="104" stroke="#d4a88c" stroke-width="2" stroke-linecap="round" />
          <line x1="158" y1="96" x2="142" y2="99" stroke="#d4a88c" stroke-width="2" stroke-linecap="round" />
          <line x1="160" y1="104" x2="143" y2="104" stroke="#d4a88c" stroke-width="2" stroke-linecap="round" />
          <!-- Большое сердце в лапках -->
          <path d="M100 132 C88 116, 62 122, 66 144 C70 162, 100 176, 100 176 C100 176, 130 162, 134 144 C138 122, 112 116, 100 132 Z" fill="#ff4d88" />
          <!-- Лапки -->
          <circle cx="69" cy="144" r="9" fill="#ffe4be" />
          <circle cx="131" cy="144" r="9" fill="#ffe4be" />
        </svg>
      </div>

      <div class="eyebrow">У МЕНЯ К ТЕБЕ СЕРЬЁЗНЫЙ ВОПРОС</div>
      <h1>Пойдёшь со мной<br>на свидание?</h1>
      <p class="subtitle">
        Обещаю хороший вечер и ни одной неловкой паузы.<br>
        <i>Котик, кстати, тоже за.</i>
      </p>

      <div class="buttons-area" id="buttons-area">
        <button class="btn btn-yes" id="btn-yes">Да ♡</button>
        <button class="btn btn-no" id="btn-no">Нет</button>
      </div>

      <div class="hint-caption" id="hint-caption"></div>
    </div>

    <!-- ЭКРАН 2: Выбор даты и времени -->
    <div class="screen" id="screen-2">
      <div class="eyebrow">ТЫ СКАЗАЛА «ДА» — ТЕПЕРЬ ГЛАВНОЕ</div>
      <h1>Выбери день и час</h1>
      <p class="subtitle" style="margin-bottom: 12px;">
        Ближайшая неделя в твоём распоряжении. Я подстроюсь.
